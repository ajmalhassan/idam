name: Publish Idam website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare public files
        run: |
          mkdir -p _site/assets
          cp site/index.html site/privacy.html site/style.css _site/
          cp site/assets/idam.svg site/assets/home.png _site/assets/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
